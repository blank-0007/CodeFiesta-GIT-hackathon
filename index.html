<!doctype html>
<html lang="en" class="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0F19" />
    <title>ReconAI — Bank Reconciliation Agent</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("reconai-ui") || "{}").state || {};
        var t = s.theme || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.dataset.density = s.density || "comfortable";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
