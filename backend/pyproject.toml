[project]
name = "reconai-backend"
version = "0.1.0"
description = "ReconAI — automated bank reconciliation & anomaly investigation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "scipy>=1.13",
    "numpy>=1.26",
    "reportlab>=4.2",
    "google-genai>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "main:app"
