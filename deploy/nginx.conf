server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/json application/javascript text/javascript image/svg+xml;

    # Hashed build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA shell so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes (/runs/…, /reports) resolve to index.html.
    location / {
        try_files $uri /index.html;
    }
}
