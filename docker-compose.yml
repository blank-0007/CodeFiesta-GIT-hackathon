# ReconAI — `docker compose up` → app http://localhost:5173, API http://localhost:8000
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/reconai.db
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - reconai-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_USE_MOCKS: "false"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reconai-data:
